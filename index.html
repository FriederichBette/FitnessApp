<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>

<body>

    <!-- AUTH BEREICH -->
    <div id="auth" style="padding: 20px; border-bottom: 1px solid #ccc;">
        <h3>Login</h3>
        <input id="email" placeholder="Email">
        <input id="password" placeholder="Passwort" type="password">
        <button id="login-btn">Login</button>

        <h3>Registrieren</h3>
        <input id="reg-email" placeholder="Email">
        <input id="reg-password" placeholder="Passwort" type="password">
        <button id="register-btn">Registrieren</button>

        <button id="logout-btn">Logout</button>
    </div>

    <div class="container">
        <header>
            <h1>Fitness Tracker</h1>
            <p class="subtitle">Übersicht über dein Training.</p>
        </header>

        <section class="selection-area">
            <div class="control-group">
                <select id="workout-select">
                    <option value="" disabled selected>Workout wählen...</option>
                    <option value="1">Full Body 1</option>
                    <option value="2">Full Body 2</option>
                    <option value="3">Full Body 3</option>
                </select>
                <button id="load-workout-btn">Laden</button>
            </div>

            <h2 id="next-workout-hint"
                style="text-align: center; margin-bottom: 20px; font-size: 1rem; color: var(--accent-color);">
            </h2>
        </section>

        <main id="workout-container">
            <div class="loading-spinner" id="main-loader"></div>
        </main>

        <section class="actions">
            <button id="save-btn" disabled>Workout speichern</button>
            <div id="motivation"></div>
        </section>
    </div>

    <!-- Supabase zuerst -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <!-- dann dein Script -->
    <script src="script.js"></script>

</body>
</html>
